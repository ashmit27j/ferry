# The M4 smoke test: an echo backend behind the Gateway the Helm chart
# creates (ferry-system/ferry), with a FerryPolicy on its Service.
apiVersion: v1
kind: Namespace
metadata:
  name: smoke
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: echo
  namespace: smoke
spec:
  replicas: 2
  selector:
    matchLabels: { app: echo }
  template:
    metadata:
      labels: { app: echo }
    spec:
      containers:
        - name: echo
          image: registry.k8s.io/gateway-api/echo-basic:v1.5.1
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - name: NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
          resources:
            requests: { cpu: 10m }
---
apiVersion: v1
kind: Service
metadata:
  name: echo
  namespace: smoke
spec:
  selector: { app: echo }
  ports:
    - { name: http, port: 8080, targetPort: 3000 }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: smoke
  namespace: smoke
spec:
  parentRefs:
    - { name: ferry, namespace: ferry-system }
  hostnames: ["smoke.example"]
  rules:
    - matches: [{ path: { type: PathPrefix, value: /smoke } }]
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set: [{ name: x-ferry-smoke, value: "1" }]
      backendRefs:
        - { name: echo, port: 8080 }
---
apiVersion: gateway.ferry.dev/v1alpha1
kind: FerryPolicy
metadata:
  name: echo
  namespace: smoke
spec:
  targetRefs:
    - { group: "", kind: Service, name: echo }
  loadBalancer: { kind: LeastRequest }
  connectTimeout: 2s
