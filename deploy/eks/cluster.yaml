# eksctl config for a Ferry staging cluster: three nodes across three zones,
# OIDC for IRSA, the VPC CNI with NetworkPolicy enforcement (the chart ships
# NetworkPolicies), and an IAM role for the AWS Load Balancer Controller.
#
#   CLUSTER=ferry-staging REGION=us-east-1 deploy/eks/up.sh
#
# up.sh substitutes CLUSTER and REGION.
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: ${CLUSTER}
  region: ${REGION}
iam:
  withOIDC: true
  serviceAccounts:
    - metadata:
        name: aws-load-balancer-controller
        namespace: kube-system
      wellKnownPolicies:
        awsLoadBalancerController: true
addons:
  - name: vpc-cni
    configurationValues: '{"enableNetworkPolicy": "true"}'
  - name: coredns
  - name: kube-proxy
managedNodeGroups:
  - name: ng-1
    # Free-tier eligible (2 vCPU, 8 GiB): accounts on the AWS Free plan can
    # only launch eligible types.
    instanceType: m7i-flex.large
    desiredCapacity: 3
    minSize: 3
    maxSize: 6
    volumeSize: 30
