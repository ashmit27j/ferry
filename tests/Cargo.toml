[package]
name = "ferry-integration-tests"
description = "In-process integration tests: the Ferry proxy against mock backends"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[test]]
name = "proxy_http"
path = "it/proxy_http.rs"

[[test]]
name = "proxy_m1"
path = "it/proxy_m1.rs"

[[test]]
name = "security"
path = "it/security.rs"

[[test]]
name = "edge"
path = "it/edge.rs"

[[test]]
name = "timeouts"
path = "it/timeouts.rs"

[[test]]
name = "retries"
path = "it/retries.rs"

[[test]]
name = "breakers"
path = "it/breakers.rs"

[[test]]
name = "outliers"
path = "it/outliers.rs"

[[test]]
name = "ratelimit"
path = "it/ratelimit.rs"

[[test]]
name = "tls"
path = "it/tls.rs"

[[test]]
name = "upstream_tls"
path = "it/upstream_tls.rs"

[[test]]
name = "websocket"
path = "it/websocket.rs"

[[test]]
name = "drain"
path = "it/drain.rs"

[[test]]
name = "grpc"
path = "it/grpc.rs"

[[test]]
name = "h2_attacks"
path = "it/h2_attacks.rs"

[[test]]
name = "observability"
path = "it/observability.rs"

[[test]]
name = "tracing"
path = "it/tracing.rs"

[[test]]
name = "dashboard"
path = "it/dashboard.rs"

[dependencies]
bytes.workspace = true
ferry-config.workspace = true
ferry-proxy.workspace = true
ferry-telemetry.workspace = true
ferry-testkit.workspace = true
opentelemetry-proto = { workspace = true, features = ["gen-tonic", "trace"] }
http.workspace = true
http-body-util.workspace = true
hyper-util = { workspace = true, features = ["client-legacy", "http1", "http2", "tokio"] }
serde_json.workspace = true
prost.workspace = true
regex.workspace = true
tokio-tungstenite.workspace = true
futures-util = { workspace = true, features = ["sink", "std"] }
rcgen.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
hyper = { workspace = true, features = ["client", "http1", "http2"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
tokio-util.workspace = true
tonic = { workspace = true, features = ["channel", "tls-aws-lc", "server", "router"] }
tokio-stream.workspace = true
tempfile.workspace = true

[lints]
workspace = true
