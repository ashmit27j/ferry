[package]
name = "ferry-integration-tests"
description = "In-process integration tests: the Ferry proxy against mock backends"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[test]]
name = "proxy_http"
path = "it/proxy_http.rs"

[dependencies]
bytes.workspace = true
ferry-config.workspace = true
ferry-proxy.workspace = true
ferry-testkit.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper-util = { workspace = true, features = ["client-legacy", "http1", "http2", "tokio"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync"] }
tokio-util.workspace = true

[lints]
workspace = true
