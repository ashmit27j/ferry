[package]
name = "ferry-integration-tests"
description = "In-process integration tests: the Ferry proxy against mock backends"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
path = "src/lib.rs"

[[test]]
name = "proxy_http"
path = "it/proxy_http.rs"

[[test]]
name = "proxy_m1"
path = "it/proxy_m1.rs"

[[test]]
name = "security"
path = "it/security.rs"

[[test]]
name = "edge"
path = "it/edge.rs"

[[test]]
name = "timeouts"
path = "it/timeouts.rs"

[[test]]
name = "retries"
path = "it/retries.rs"

[dependencies]
bytes.workspace = true
ferry-config.workspace = true
ferry-proxy.workspace = true
ferry-testkit.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper-util = { workspace = true, features = ["client-legacy", "http1", "http2", "tokio"] }
serde_json.workspace = true
prost.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync", "net", "io-util"] }
tokio-util.workspace = true
tonic = { workspace = true, features = ["channel"] }
tokio-stream.workspace = true
tempfile.workspace = true

[lints]
workspace = true
