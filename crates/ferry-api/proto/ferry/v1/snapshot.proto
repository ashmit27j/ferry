// Control plane to data plane snapshot delivery.
//
// A proxy opens one long-lived StreamSnapshots call to the leader controller.
// The controller pushes a SnapshotUpdate whenever the reconciled configuration
// changes. The proxy answers every update with a SnapshotAck: accepted (ACK) once
// the snapshot is swapped in, or rejected (NACK) with an error, in which case it
// keeps serving its last good snapshot. Semantics follow Envoy's xDS ACK/NACK.
syntax = "proto3";

package ferry.v1;

service SnapshotService {
  // Bidirectional: the proxy sends a hello ack (version 0) then one ack per update.
  rpc StreamSnapshots(stream SnapshotAck) returns (stream SnapshotUpdate);
}

message SnapshotUpdate {
  // Monotonic snapshot version.
  uint64 version = 1;
  // Opaque token echoed in the matching ack, so acks for superseded updates are ignored.
  string nonce = 2;
  // The snapshot, encoded as the ferry-config JSON form. A typed encoding may replace this in M4.
  bytes snapshot_json = 3;
}

message SnapshotAck {
  // Proxy identity (pod name).
  string proxy_id = 1;
  // Version this ack refers to; on NACK, the last version the proxy accepted.
  uint64 version = 2;
  // Nonce from the update being acknowledged; empty on the initial hello.
  string nonce = 3;
  // Why the update was rejected. Empty means accepted.
  string error = 4;
}
