name: release

# release-please keeps a release PR open from conventional commits on main.
# Merging it tags vX.Y.Z and creates the GitHub release; the publish job
# then pushes a multi-arch image and the Helm chart to GHCR, signs both with
# Cosign keyless signing (Sigstore, GitHub OIDC), and attaches an SPDX SBOM
# and build provenance. See SECURITY.md for verification.
#
# Everything runs in this one workflow because tags pushed with
# GITHUB_TOKEN do not trigger other workflows.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/ferry
  CHART_REPO: oci://ghcr.io/${{ github.repository_owner }}/charts

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
      pr: ${{ steps.rp.outputs.pr }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # release-please bumps the workspace version in Cargo.toml; Cargo.lock
  # records it too, and CI builds with --locked.
  lockfile:
    needs: release-please
    if: needs.release-please.outputs.pr != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
      - name: Refresh workspace versions in Cargo.lock
        run: |
          cargo update --workspace --offline || cargo update --workspace
          if ! git diff --quiet Cargo.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore: refresh Cargo.lock for the release"
            git push
          fi

  publish:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write # release assets
      packages: write # GHCR
      id-token: write # Cosign keyless signing, provenance
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.release-please.outputs.tag }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}},value=${{ needs.release-please.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.release-please.outputs.tag }}
            type=sha
      - id: build
        name: Build and push linux/amd64 and linux/arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the image (keyless)
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: ferry-${{ needs.release-please.outputs.version }}.spdx.json
          upload-release-assets: false
      - name: Attest the SBOM (keyless)
        run: |
          cosign attest --yes --type spdxjson \
            --predicate "ferry-${{ needs.release-please.outputs.version }}.spdx.json" \
            "${IMAGE}@${{ steps.build.outputs.digest }}"
      - name: Build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Push and sign the Helm chart
        run: |
          helm package deploy/helm/ferry --destination dist
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          out=$(helm push dist/ferry-*.tgz "$CHART_REPO" 2>&1); echo "$out"
          digest=$(echo "$out" | sed -n 's/^Digest: //p')
          cosign sign --yes "${CHART_REPO#oci://}/ferry@${digest}"
      - name: Attach artifacts to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag }}" \
            dist/ferry-*.tgz "ferry-${{ needs.release-please.outputs.version }}.spdx.json"
          gh release edit "${{ needs.release-please.outputs.tag }}" --notes-file - <<EOF
          $(gh release view "${{ needs.release-please.outputs.tag }}" --json body -q .body)

          ## Image

          \`${IMAGE}:${{ needs.release-please.outputs.version }}\` (linux/amd64, linux/arm64)
          digest \`${{ steps.build.outputs.digest }}\`, signed with Cosign keyless signing;
          see SECURITY.md to verify it.
          EOF
