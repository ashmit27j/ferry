[package]
name = "ferry-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4.13"
ferry-config = { path = "../crates/ferry-config" }
ferry-controller = { path = "../crates/ferry-controller" }
ferry-proxy = { path = "../crates/ferry-proxy" }
http = "1.5"
serde_json = "1.0"

# Keep the fuzz crate out of the main workspace; cargo-fuzz needs nightly.
[workspace]
members = ["."]

[[bin]]
name = "config_yaml"
path = "fuzz_targets/config_yaml.rs"
test = false
doc = false
bench = false

[[bin]]
name = "proxy_protocol"
path = "fuzz_targets/proxy_protocol.rs"
test = false
doc = false
bench = false

[[bin]]
name = "snapshot_json"
path = "fuzz_targets/snapshot_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "header_values"
path = "fuzz_targets/header_values.rs"
test = false
doc = false
bench = false

[[bin]]
name = "router"
path = "fuzz_targets/router.rs"
test = false
doc = false
bench = false

[[bin]]
name = "gateway_manifests"
path = "fuzz_targets/gateway_manifests.rs"
test = false
doc = false
bench = false
