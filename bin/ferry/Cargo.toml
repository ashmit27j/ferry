[package]
name = "ferry"
description = "Ferry: a Kubernetes-native L7 load balancer and API gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "ferry"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
ferry-config.workspace = true
ferry-controller.workspace = true
ferry-proxy.workspace = true
ferry-telemetry.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal"] }
tokio-util.workspace = true
tracing.workspace = true

[target.'cfg(not(target_env = "msvc"))'.dependencies]
tikv-jemallocator.workspace = true

[dev-dependencies]
bytes.workspace = true
ferry-testkit.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper-util = { workspace = true, features = ["client-legacy", "http1", "tokio"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["time", "process"] }

[lints]
workspace = true
